name: flutter_country_selector
description: A country picker to select a country. Merged into phone_form_field, this package now re-exports it.
version: 3.0.0
repository: https://github.com/cedvdb/flutter_country_selector
homepage: https://github.com/cedvdb/flutter_country_selector

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # The country selector sources, arbs and generated localizations live there.
  phone_form_field: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.0
  flutter_lints: ^6.0.0

# Local development only: use the sibling checkout until phone_form_field
# 12.0.0 is published. Dependency overrides of a package are ignored by its
# consumers, so this does not leak into the published package.
dependency_overrides:
  phone_form_field:
    path: ../phone_form_field
